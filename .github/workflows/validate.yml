name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch Home Assistant / HACS changes before users do

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 gets an older Home Assistant, 3.14 the current one (2026.10+ needs Python 3.14).
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          pip install pytest-homeassistant-custom-component
          HA_DIR=$(python -c "import homeassistant, os; print(os.path.dirname(homeassistant.__file__))")
          pip install "$(grep -h '^home-assistant-frontend' "$HA_DIR/package_constraints.txt")"
      - run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: for f in custom_components/sk_panel_manager/frontend/*.js; do node --check "$f"; done
